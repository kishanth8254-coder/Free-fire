<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - BLACK LTZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white font-sans">
    <nav class="border-b border-white/10 bg-black/50 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="text-2xl font-black tracking-tighter neon-text-purple">BLACK LTZ ADMIN</a>
                <button id="logout-btn" class="px-4 py-2 rounded-full text-sm font-bold bg-red-600/20 text-red-500 border border-red-500/50 hover:bg-red-600 hover:text-white transition-all">Logout</button>
            </div>
        </div>
    </nav>

    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card p-8 rounded-3xl w-full max-w-md neon-border-purple">
            <h2 class="text-3xl font-black mb-6 text-center">ADMIN LOGIN</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-1">Password</label>
                    <input type="password" id="admin-password" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-purple-500 transition-colors">
                </div>
                <button id="login-btn" class="w-full py-4 rounded-xl bg-purple-600 text-white font-bold uppercase tracking-widest text-sm hover:bg-purple-700 transition-all">Login</button>
            </div>
        </div>
    </div>

    <div id="admin-section" class="hidden max-w-7xl mx-auto px-4 py-12">
        <div class="flex flex-col md:flex-row gap-8">
            <!-- Sidebar -->
            <div class="w-full md:w-64 space-y-2">
                <button onclick="showCategory('topup')" class="category-btn w-full text-left px-6 py-4 rounded-2xl glass-card border border-white/10 hover:border-purple-500 transition-all active" data-category="topup">Top-Up Services</button>
                <button onclick="showCategory('boost')" class="category-btn w-full text-left px-6 py-4 rounded-2xl glass-card border border-white/10 hover:border-purple-500 transition-all" data-category="boost">Guild Boost</button>
                <button onclick="showCategory('panel')" class="category-btn w-full text-left px-6 py-4 rounded-2xl glass-card border border-white/10 hover:border-purple-500 transition-all" data-category="panel">Panel Store</button>
                <button onclick="showCategory('tiktok')" class="category-btn w-full text-left px-6 py-4 rounded-2xl glass-card border border-white/10 hover:border-purple-500 transition-all" data-category="tiktok">TikTok Offers</button>
                <button onclick="showCategory('webdev')" class="category-btn w-full text-left px-6 py-4 rounded-2xl glass-card border border-white/10 hover:border-purple-500 transition-all" data-category="webdev">Web Dev</button>
            </div>

            <!-- Content -->
            <div class="flex-1">
                <div class="flex items-center justify-between mb-8">
                    <h2 id="current-category-title" class="text-3xl font-black uppercase">Top-Up Services</h2>
                    <button onclick="addNewService()" class="px-6 py-3 rounded-xl bg-green-600 text-white font-bold hover:bg-green-700 transition-all">Add New Service</button>
                </div>

                <div id="services-list" class="grid grid-cols-1 gap-4">
                    <!-- Services will be loaded here -->
                </div>

                <div class="mt-12 flex justify-end">
                    <button id="save-all-btn" class="px-10 py-4 rounded-2xl bg-purple-600 text-white font-black uppercase tracking-widest hover:bg-purple-700 transition-all btn-glow-purple">Save All Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentCategory = 'topup';
        let allData = {};
        let adminPassword = '';

        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const passwordInput = document.getElementById('admin-password');
        const servicesList = document.getElementById('services-list');
        const saveAllBtn = document.getElementById('save-all-btn');

        loginBtn.addEventListener('click', () => {
            adminPassword = passwordInput.value;
            loadData();
        });

        logoutBtn.addEventListener('click', () => {
            adminPassword = '';
            loginSection.classList.remove('hidden');
            adminSection.classList.add('hidden');
        });

        async function loadData() {
            try {
                const res = await fetch('/api/services');
                allData = await res.json();
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                renderServices();
            } catch (error) {
                alert('Failed to load data');
            }
        }

        function showCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('border-purple-500', 'bg-purple-600/10');
                if(btn.dataset.category === cat) {
                    btn.classList.add('border-purple-500', 'bg-purple-600/10');
                }
            });
            document.getElementById('current-category-title').innerText = cat.toUpperCase() + ' SERVICES';
            renderServices();
        }

        function renderServices() {
            const services = allData[currentCategory] || [];
            servicesList.innerHTML = '';
            
            services.forEach((service, index) => {
                const card = document.createElement('div');
                card.className = 'glass-card p-6 rounded-2xl border border-white/10 space-y-4';
                card.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Service Name</label>
                            <input type="text" value="${service.name}" onchange="updateService(${index}, 'name', this.value)" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2 focus:border-purple-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Price (LKR)</label>
                            <input type="text" value="${service.price}" onchange="updateService(${index}, 'price', this.value)" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2 focus:border-purple-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Features (Comma separated)</label>
                        <input type="text" value="${service.features.join(', ')}" onchange="updateService(${index}, 'features', this.value.split(',').map(s => s.trim()))" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2 focus:border-purple-500 outline-none">
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-white/5">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" ${service.popular ? 'checked' : ''} onchange="updateService(${index}, 'popular', this.checked)" class="w-4 h-4 accent-purple-600">
                            <span class="text-xs font-bold uppercase text-gray-400">Mark as Popular</span>
                        </label>
                        <button onclick="deleteService(${index})" class="text-red-500 hover:text-red-400 transition-colors"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                `;
                servicesList.appendChild(card);
            });
        }

        function updateService(index, field, value) {
            allData[currentCategory][index][field] = value;
        }

        function deleteService(index) {
            if(confirm('Are you sure you want to delete this service?')) {
                allData[currentCategory].splice(index, 1);
                renderServices();
            }
        }

        function addNewService() {
            if(!allData[currentCategory]) allData[currentCategory] = [];
            allData[currentCategory].push({
                id: Date.now().toString(),
                name: 'New Service',
                price: '0',
                features: ['Feature 1'],
                popular: false
            });
            renderServices();
        }

        saveAllBtn.addEventListener('click', async () => {
            saveAllBtn.disabled = true;
            saveAllBtn.innerText = 'Saving...';
            
            try {
                const res = await fetch('/api/services', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: adminPassword,
                        data: allData
                    })
                });
                
                const result = await res.json();
                if(res.ok) {
                    alert('All changes saved successfully!');
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Failed to save changes');
            } finally {
                saveAllBtn.disabled = false;
                saveAllBtn.innerText = 'Save All Changes';
            }
        });
    </script>
</body>
</html>
